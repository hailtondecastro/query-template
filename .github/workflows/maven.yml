name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [published] # This ensures it runs only when the release is finalized 

jobs:
  build:    
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 11, 21 ]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11/21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B verify -P ${{ matrix.java-version }}

  publish:

    runs-on: ubuntu-latest
    
    if: github.event_name == 'release'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11 for deploy to Maven Central
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          server-id: central
          # These must be the NAMES of the env vars provided in the deploy step
          # below (not the secret values). setup-java writes ${env.MAVEN_USERNAME}
          # / ${env.MAVEN_PASSWORD} into settings.xml for the 'central' server.
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: mvn -B -Prelease deploy -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}